name: CI

on:
  push:
    branches: main
    # paths:
    #   - 'VERSION'

jobs:

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - id: autopuppeteer
        uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          goal: find the date the english wiki page about giraffes has been last modified
          url: https://www.wikipedia.org/
          openai_api_token: ${{ secrets.OPENAI_TOKEN }}
      - run: |
          echo ::notice::"${{ steps.autopuppeteer.outputs.result }}"
          echo ::notice::"$(cat ${{ steps.autopuppeteer.outputs.result_path }})"

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@v5.49.0
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: ${{ github.token }}
      - uses: actions/checkout@v6
      - run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
        id: version
      - uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: AutoPuppeteer v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
