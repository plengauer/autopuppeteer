name: CI

on:
  push:
    branches: main
    paths:
      - 'VERSION'

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        token:
          - openai
          - github
    permissions:
      contents: read
      models: read
      actions: read
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@909c7153cce2c6ef916f4fde6958886d9d65af03 # v5.55.0
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: |-
            ${{ github.token }}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: autopuppeteer
        uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          goal: find the date the english wiki page about giraffes has been last modified
          url: https://www.wikipedia.org/
          openai_api_token: ${{ matrix.token == 'openai' && secrets.OPENAI_TOKEN || '' }}
          debug: 1
      - run: |
          echo ::notice::"${{ steps.autopuppeteer.outputs.result }}"
          echo ::notice::"$(cat ${{ steps.autopuppeteer.outputs.result_path }})"
      - run: |
          [ "${{ steps.autopuppeteer.outputs.result }}" = "$(cat ${{ steps.autopuppeteer.outputs.result_path }})" ]
      - run: |
          day="$(cat ${{ steps.autopuppeteer.outputs.result_path }} | cut -d ' ' -f 1)"
          [ "$day" -ge 1 ] && [ "$day" -le 31 ] || exit 1
      - run: |
          month="$(cat ${{ steps.autopuppeteer.outputs.result_path }} | cut -d ' ' -f 2)"
          case "$month" in
            January|February|March|April|May|June|July|August|September|October|November|December) :;;
            *) exit 1;;
          esac
      - run: |
          year="$(cat ${{ steps.autopuppeteer.outputs.result_path }} | cut -d ' ' -f 3)"
          [ "$year" -ge 2026 ] && [ "$year" -le "$(date +%Y)" ] || exit 1

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@909c7153cce2c6ef916f4fde6958886d9d65af03 # v5.55.0
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: ${{ github.token }}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          api_url="https://api.github.com/repos/${{ github.repository }}"
          auth_scheme="Bearer"
          auth_header="Authorization: ${auth_scheme} $GH_TOKEN"
          accept_header="Accept: application/vnd.github+json"
          release_response="$(mktemp)"

          existing_status="$(curl --silent --show-error --output "$release_response" --write-out "%{http_code}" \
            -H "$auth_header" \
            -H "$accept_header" \
            "$api_url/releases/tags/$tag")"
          if [ "$existing_status" = 200 ]; then
            jq -r '.html_url' < "$release_response"
            exit 0
          fi
          if [ "$existing_status" != 404 ]; then
            cat "$release_response"
            exit 1
          fi

          create_payload="$(jq -n --arg tag "$tag" --arg target "${{ github.sha }}" '{ tag_name: $tag, name: $tag, target_commitish: $target, generate_release_notes: true }')"
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "$auth_header" \
            -H "$accept_header" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url/releases" \
            --data "$create_payload" \
            | jq -r '.html_url'
